<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle District</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script>
// Prevent Tab navigation, F5, and Ctrl+W/A/S/D/R shortcuts from breaking browser session
window.addEventListener("keydown", function(e) {
  if (
    e.key === "Tab" ||
    e.code === "Tab" ||
    e.key === "F5" ||
    e.code === "F5" ||
    ((e.ctrlKey || e.metaKey) && ["KeyW", "KeyA", "KeyS", "KeyD", "KeyR", "KeyF", "Tab"].includes(e.code)) ||
    ((e.ctrlKey || e.metaKey) && (e.key === "r" || e.key === "R" || e.key === "w" || e.key === "W"))
  ) {
    e.preventDefault();
  }
}, { capture: true, passive: false });
window.addEventListener("keyup", function(e) {
  if (
    e.key === "Tab" ||
    e.code === "Tab" ||
    e.key === "F5" ||
    e.code === "F5" ||
    ((e.ctrlKey || e.metaKey) && ["KeyW", "KeyA", "KeyS", "KeyD", "KeyR", "KeyF", "Tab"].includes(e.code)) ||
    ((e.ctrlKey || e.metaKey) && (e.key === "r" || e.key === "R" || e.key === "w" || e.key === "W"))
  ) {
    e.preventDefault();
  }
}, { capture: true, passive: false });
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
