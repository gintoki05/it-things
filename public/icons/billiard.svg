<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Table Felt Radial Glow -->
    <radialGradient id="feltBg" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E8A4C" />
      <stop offset="70%" stop-color="#096336" />
      <stop offset="100%" stop-color="#053D21" />
    </radialGradient>

    <!-- Wood Rail Border Gradient -->
    <linearGradient id="woodBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="50%" stop-color="#5C2E0B" />
      <stop offset="100%" stop-color="#361B06" />
    </linearGradient>

    <!-- 8-Ball Spherical Shading -->
    <radialGradient id="eightBallGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="30%" stop-color="#222222" />
      <stop offset="85%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Cue Ball Spherical Shading -->
    <radialGradient id="cueBallGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#9E9E9E" />
    </radialGradient>

    <!-- Red Solid Ball Grad -->
    <radialGradient id="redBallGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#5A0B0B" />
    </radialGradient>

    <!-- Cue Stick Wood Gradient -->
    <linearGradient id="cueShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- 1. Retro Pool Table Badge Base (Rounded Diamond / Beveled Slate) -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#woodBorder)" stroke="#D4AF37" stroke-width="1" />
  <!-- Inner Green Felt Table -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="4.5" fill="url(#feltBg)" stroke="#053D21" stroke-width="0.8" />

  <!-- Cushion Diamond Sights -->
  <circle cx="16" cy="1.8" r="0.8" fill="#FDE047" />
  <circle cx="16" cy="30.2" r="0.8" fill="#FDE047" />
  <circle cx="1.8" cy="16" r="0.8" fill="#FDE047" />
  <circle cx="30.2" cy="16" r="0.8" fill="#FDE047" />

  <!-- 2. Small Secondary Balls on Felt with Shadows -->
  <!-- Red 3-Ball -->
  <ellipse cx="8" cy="23.5" rx="4" ry="2" fill="rgba(0,0,0,0.4)" />
  <circle cx="8" cy="22" r="4" fill="url(#redBallGrad)" />
  <circle cx="7" cy="21" r="1.3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="6.5" cy="20.5" r="0.7" fill="#FFFFFF" />

  <!-- White Cue Ball -->
  <ellipse cx="23" cy="9.5" rx="3.5" ry="1.8" fill="rgba(0,0,0,0.4)" />
  <circle cx="23" cy="8.5" r="3.5" fill="url(#cueBallGrad)" />
  <circle cx="23" cy="8.5" r="0.7" fill="#D32F2F" />
  <circle cx="22" cy="7.5" r="1" fill="#FFFFFF" opacity="0.9" />

  <!-- 3. Primary 8-Ball (Centered, Hero Element) -->
  <!-- Ball Shadow -->
  <ellipse cx="16" cy="18.5" rx="7.5" ry="3.5" fill="rgba(0,0,0,0.55)" />

  <!-- Main 8-Ball Sphere -->
  <circle cx="15.5" cy="15" r="7.5" fill="url(#eightBallGrad)" stroke="#111111" stroke-width="0.5" />

  <!-- White Badge Circle for "8" -->
  <circle cx="15.5" cy="15" r="3.6" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.3" />

  <!-- Crisp Pixel-Perfect Bold "8" -->
  <text x="15.5" y="17.6" font-family="'Segoe UI', Arial, sans-serif" font-size="7.2" font-weight="900" text-anchor="middle" fill="#000000">8</text>

  <!-- Specular 3D Gloss Highlight on 8-Ball -->
  <path d="M 12 10.5 A 5 5 0 0 1 17 9.5 A 5 5 0 0 0 12.5 13 Z" fill="#FFFFFF" opacity="0.65" />
  <circle cx="12" cy="11" r="0.8" fill="#FFFFFF" opacity="0.9" />

  <!-- 4. Diagonal Pool Cue Stick Aiming at 8-Ball -->
  <g transform="rotate(-38 16 16)">
    <!-- Cue Shadow -->
    <rect x="-1" y="27.5" width="22" height="1.8" rx="0.9" fill="rgba(0,0,0,0.4)" />
    <!-- Cue Shaft -->
    <polygon points="-1,26 21,26 21,28 -1,27.5" fill="url(#cueShaft)" />
    <!-- Irish Linen Grip -->
    <rect x="-1" y="26" width="7" height="1.8" fill="#1C1917" stroke="#44403C" stroke-width="0.3" />
    <line x1="1" y1="26" x2="1" y2="27.8" stroke="#D4AF37" stroke-width="0.4" />
    <line x1="4" y1="26" x2="4" y2="27.8" stroke="#D4AF37" stroke-width="0.4" />
    <!-- White Ferrule -->
    <rect x="20.5" y="26.1" width="1.8" height="1.6" fill="#F8FAFC" />
    <!-- Blue Chalk Tip -->
    <rect x="22.3" y="26.1" width="1" height="1.6" rx="0.4" fill="#0284C7" />
  </g>
</svg>
