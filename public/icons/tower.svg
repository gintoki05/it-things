<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sky / Shadow subtle ground -->
  <rect x="2" y="30" width="28" height="2" fill="#4B5563" />
  <rect x="4" y="29" width="24" height="1" fill="#9CA3AF" />

  <!-- Base Foundation Slab -->
  <rect x="5" y="26" width="22" height="3" fill="#6B7280" />
  <rect x="5" y="26" width="22" height="1" fill="#D1D5DB" />
  <rect x="26" y="26" width="1" height="3" fill="#374151" />
  <rect x="5" y="28" width="22" height="1" fill="#374151" />

  <!-- Tower Floor 1 (Bottom) -->
  <rect x="7" y="19" width="18" height="7" fill="#B91C1C" />
  <!-- Bevels -->
  <rect x="7" y="19" width="18" height="1" fill="#F87171" />
  <rect x="7" y="19" width="1" height="7" fill="#F87171" />
  <rect x="24" y="19" width="1" height="7" fill="#7F1D1D" />
  <rect x="7" y="25" width="18" height="1" fill="#7F1D1D" />
  <!-- Windows Floor 1 -->
  <rect x="10" y="21" width="4" height="3" fill="#FEF08A" />
  <rect x="18" y="21" width="4" height="3" fill="#FEF08A" />
  <rect x="12" y="21" width="1" height="3" fill="#451A03" />
  <rect x="20" y="21" width="1" height="3" fill="#451A03" />

  <!-- Tower Floor 2 (Middle) -->
  <rect x="7" y="12" width="18" height="7" fill="#DC2626" />
  <!-- Ledge/Cornice between floors -->
  <rect x="6" y="18" width="20" height="1" fill="#FFFFFF" />
  <rect x="6" y="19" width="20" height="1" fill="#4B5563" />
  <!-- Bevels -->
  <rect x="7" y="12" width="18" height="1" fill="#FCA5A5" />
  <rect x="7" y="12" width="1" height="7" fill="#FCA5A5" />
  <rect x="24" y="12" width="1" height="7" fill="#7F1D1D" />
  <!-- Windows Floor 2 -->
  <rect x="10" y="14" width="4" height="3" fill="#7DD3FC" />
  <rect x="18" y="14" width="4" height="3" fill="#FEF08A" />
  <rect x="12" y="14" width="1" height="3" fill="#0369A1" />
  <rect x="20" y="14" width="1" height="3" fill="#451A03" />

  <!-- Top Roof Ledge -->
  <rect x="6" y="11" width="20" height="1" fill="#FFFFFF" />
  <rect x="6" y="12" width="20" height="1" fill="#374151" />

  <!-- Construction Crane on Top -->
  <!-- Crane Tower Mast (vertical) -->
  <rect x="19" y="3" width="2" height="8" fill="#EAB308" />
  <rect x="20" y="3" width="1" height="8" fill="#FDE047" />
  <!-- Crane Arm (horizontal jib) -->
  <rect x="8" y="3" width="19" height="2" fill="#EAB308" />
  <rect x="8" y="3" width="19" height="1" fill="#FEF08A" />
  <rect x="8" y="4" width="19" height="1" fill="#A16207" />
  <!-- Counterweight -->
  <rect x="24" y="2" width="4" height="4" fill="#374151" />
  <rect x="24" y="2" width="4" height="1" fill="#6B7280" />
  <!-- Crane Cab / Peak -->
  <polygon points="19,3 21,3 20,0" fill="#CA8A04" />
  <rect x="20" y="0" width="1" height="1" fill="#FEF08A" />
  <!-- Pendant cable wire from peak to jib -->
  <line x1="20" y1="0" x2="12" y2="3" stroke="#4B5563" stroke-width="1" />

  <!-- Hanging Cable & Block -->
  <line x1="12" y1="5" x2="12" y2="8" stroke="#1F2937" stroke-width="1" />
  <!-- Clamps -->
  <rect x="11" y="7" width="2" height="1" fill="#1F2937" />
  <!-- Hanging Block (Swinging in air) -->
  <rect x="8" y="8" width="8" height="3" fill="#EF4444" />
  <rect x="8" y="8" width="8" height="1" fill="#FECACA" />
  <rect x="8" y="8" width="1" height="3" fill="#FECACA" />
  <rect x="15" y="8" width="1" height="3" fill="#991B1B" />
  <rect x="8" y="10" width="8" height="1" fill="#991B1B" />
  <rect x="11" y="9" width="2" height="1" fill="#FEF08A" />
</svg>
