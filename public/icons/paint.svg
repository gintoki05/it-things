<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wooden Palette Body -->
  <!-- Outer Shadow / Outline -->
  <path d="M 6,5 L 22,5 L 26,9 L 28,15 L 28,21 L 24,27 L 18,29 L 10,29 L 5,26 L 3,20 L 3,12 L 6,5 Z" fill="#78350F" />

  <!-- Inner Wood Fill -->
  <path d="M 7,6 L 21,6 L 25,10 L 27,15 L 27,20 L 23,26 L 18,28 L 11,28 L 6,25 L 4,20 L 4,12 L 7,6 Z" fill="#D97706" />

  <!-- Wood Grain & Light Highlights (3D Bevel) -->
  <path d="M 7,6 L 21,6 L 24,9 L 25,10 L 26,15" stroke="#FDE68A" stroke-width="1" fill="none" />
  <path d="M 4,13 L 4,20 L 6,25 L 11,28" stroke="#FDE68A" stroke-width="1" fill="none" />
  <rect x="7" y="7" width="13" height="1" fill="#FEF3C7" />
  <rect x="5" y="14" width="1" height="6" fill="#FEF3C7" />

  <!-- Wood Shadow Bevel -->
  <path d="M 27,20 L 23,26 L 18,28" stroke="#92400E" stroke-width="1" fill="none" />

  <!-- Palette Thumb Hole -->
  <ellipse cx="21" cy="22" rx="3" ry="2" fill="#78350F" />
  <ellipse cx="21" cy="22" rx="2" ry="1.5" fill="#451A03" />
  <ellipse cx="21" cy="21.5" rx="1.5" ry="0.8" fill="#1F2937" />

  <!-- Paint Dollops -->
  <!-- Red Paint (top left) -->
  <rect x="8" y="9" width="4" height="4" fill="#DC2626" />
  <rect x="9" y="8" width="2" height="6" fill="#DC2626" />
  <rect x="9" y="9" width="1" height="1" fill="#FCA5A5" /> <!-- gloss highlight -->
  <rect x="7" y="10" width="1" height="2" fill="#991B1B" />

  <!-- Yellow Paint (top center) -->
  <rect x="15" y="8" width="4" height="4" fill="#FACC15" />
  <rect x="16" y="7" width="2" height="6" fill="#FACC15" />
  <rect x="16" y="8" width="1" height="1" fill="#FEF9C3" />
  <rect x="15" y="11" width="4" height="1" fill="#CA8A04" />

  <!-- Blue Paint (top right) -->
  <rect x="21" y="11" width="4" height="4" fill="#2563EB" />
  <rect x="22" y="10" width="2" height="6" fill="#2563EB" />
  <rect x="22" y="11" width="1" height="1" fill="#BFDBFE" />
  <rect x="21" y="14" width="4" height="1" fill="#1E40AF" />

  <!-- Green Paint (bottom left) -->
  <rect x="7" y="18" width="4" height="4" fill="#16A34A" />
  <rect x="8" y="17" width="2" height="6" fill="#16A34A" />
  <rect x="8" y="18" width="1" height="1" fill="#BBF7D0" />
  <rect x="7" y="21" width="4" height="1" fill="#15803D" />

  <!-- Purple/Cyan Paint (bottom center) -->
  <rect x="13" y="22" width="4" height="3" fill="#06B6D4" />
  <rect x="14" y="21" width="2" height="4" fill="#06B6D4" />
  <rect x="14" y="22" width="1" height="1" fill="#CFFAFE" />

  <!-- Paintbrush across the palette diagonally -->
  <!-- Brush Handle (Wood) -->
  <line x1="2" y1="2" x2="16" y2="16" stroke="#451A03" stroke-width="3" />
  <line x1="2" y1="2" x2="15" y2="15" stroke="#B45309" stroke-width="2" />
  <line x1="2" y1="2" x2="14" y2="14" stroke="#FDE68A" stroke-width="1" />

  <!-- Metal Ferrule (Silver) -->
  <line x1="15" y1="15" x2="18" y2="18" stroke="#374151" stroke-width="4" />
  <line x1="15" y1="15" x2="18" y2="18" stroke="#E5E7EB" stroke-width="3" />
  <line x1="16" y1="16" x2="17" y2="17" stroke="#9CA3AF" stroke-width="2" />

  <!-- Bristles (Black/Dark) -->
  <line x1="18" y1="18" x2="22" y2="22" stroke="#1F2937" stroke-width="4" />
  <line x1="19" y1="19" x2="21" y2="21" stroke="#374151" stroke-width="3" />

  <!-- Brush Tip Dipped in Paint (Vivid Red/Crimson) -->
  <line x1="21" y1="21" x2="24" y2="24" stroke="#EF4444" stroke-width="3" />
  <rect x="23" y="23" width="2" height="2" fill="#DC2626" />
  <rect x="24" y="24" width="1" height="1" fill="#F87171" />
</svg>
