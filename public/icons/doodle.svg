<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Notebook Page Drop Shadow -->
  <rect x="5" y="4" width="22" height="25" fill="#000000" opacity="0.25" />
  
  <!-- Outer Outline (Dark Blue/Gray) -->
  <rect x="4" y="3" width="22" height="25" fill="#1E293B" />
  
  <!-- Notebook Paper Fill (Cream/Ivory) -->
  <rect x="5" y="4" width="20" height="23" fill="#FDFBF7" />
  
  <!-- Paper 3D Highlights (Top & Left Bevel) -->
  <rect x="5" y="4" width="20" height="1" fill="#FFFFFF" />
  <rect x="5" y="4" width="1" height="23" fill="#FFFFFF" />
  
  <!-- Paper Bottom/Right Bevel -->
  <rect x="5" y="26" width="20" height="1" fill="#E2E8F0" />
  <rect x="24" y="4" width="1" height="23" fill="#E2E8F0" />
  
  <!-- Spiral Binder Perforations / Left Holes -->
  <rect x="6" y="6" width="1" height="2" fill="#94A3B8" />
  <rect x="6" y="11" width="1" height="2" fill="#94A3B8" />
  <rect x="6" y="16" width="1" height="2" fill="#94A3B8" />
  <rect x="6" y="21" width="1" height="2" fill="#94A3B8" />

  <!-- Red Margin Vertical Line -->
  <rect x="9" y="4" width="1" height="23" fill="#EF4444" opacity="0.8" />
  
  <!-- Blue Ruled Horizontal Lines -->
  <rect x="10" y="8" width="14" height="1" fill="#93C5FD" opacity="0.75" />
  <rect x="10" y="13" width="14" height="1" fill="#93C5FD" opacity="0.75" />
  <rect x="10" y="18" width="14" height="1" fill="#93C5FD" opacity="0.75" />
  <rect x="10" y="23" width="14" height="1" fill="#93C5FD" opacity="0.75" />

  <!-- Scribbled Doodle Character (Stickman Soldier with Gun) -->
  <!-- Head -->
  <rect x="14" y="9" width="3" height="3" fill="#1D4ED8" />
  <rect x="15" y="10" width="1" height="1" fill="#FDFBF7" /> <!-- Eye hollow -->
  
  <!-- Body (Spine) -->
  <rect x="15" y="12" width="1" height="5" fill="#1D4ED8" />
  
  <!-- Legs -->
  <rect x="14" y="17" width="1" height="3" fill="#1D4ED8" />
  <rect x="13" y="19" width="1" height="1" fill="#1D4ED8" /> <!-- Foot left -->
  <rect x="16" y="17" width="1" height="3" fill="#1D4ED8" />
  <rect x="17" y="19" width="1" height="1" fill="#1D4ED8" /> <!-- Foot right -->
  
  <!-- Arms & Gun -->
  <rect x="13" y="13" width="2" height="1" fill="#1D4ED8" />
  <rect x="16" y="13" width="4" height="1" fill="#1D4ED8" /> <!-- Rifle barrel -->
  <rect x="18" y="14" width="1" height="2" fill="#1D4ED8" /> <!-- Magazine -->
  <rect x="20" y="12" width="1" height="3" fill="#EF4444" /> <!-- Muzzle Flash spark -->

  <!-- Crosshair Doodle (Top Right) -->
  <rect x="21" y="5" width="3" height="1" fill="#EF4444" />
  <rect x="22" y="4" width="1" height="3" fill="#EF4444" />

  <!-- Ballpoint Pen (Tilted Across Corner) -->
  <!-- Pen Clip & Cap -->
  <rect x="23" y="18" width="2" height="3" fill="#1E3A8A" />
  <rect x="24" y="19" width="1" height="3" fill="#93C5FD" />
  <!-- Pen Body -->
  <rect x="22" y="20" width="2" height="4" fill="#2563EB" />
  <rect x="21" y="23" width="2" height="3" fill="#1D4ED8" />
  <rect x="20" y="25" width="2" height="2" fill="#3B82F6" />
  <!-- Pen Tip (Brass/Silver) -->
  <rect x="19" y="26" width="2" height="2" fill="#CBD5E1" />
  <rect x="18" y="27" width="1" height="1" fill="#1E293B" /> <!-- Ink point -->
</svg>
