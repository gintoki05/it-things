<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Background Circle -->
  <rect width="64" height="64" rx="32" fill="#0A192F" />
  <!-- Stars -->
  <rect x="14" y="14" width="2" height="2" fill="#FFD700" />
  <rect x="48" y="12" width="2" height="2" fill="#FFFFFF" />
  <rect x="12" y="38" width="2" height="2" fill="#FFFFFF" />
  <rect x="52" y="34" width="2" height="2" fill="#FFD700" />
  <!-- Rocket Nosecone -->
  <rect x="30" y="8" width="4" height="4" fill="#E53935" />
  <rect x="28" y="12" width="8" height="4" fill="#E53935" />
  <rect x="26" y="16" width="12" height="4" fill="#E53935" />
  <!-- Rocket Main Fuselage -->
  <rect x="24" y="20" width="16" height="22" fill="#ECEFF1" />
  <rect x="24" y="20" width="4" height="22" fill="#CFD8DC" />
  <!-- Porthole Window -->
  <rect x="28" y="24" width="8" height="8" fill="#1E88E5" rx="1" />
  <rect x="30" y="26" width="2" height="2" fill="#E0F7FA" />
  <!-- Fins (Left & Right) -->
  <rect x="18" y="32" width="6" height="12" fill="#E53935" />
  <rect x="16" y="38" width="4" height="8" fill="#C62828" />
  <rect x="40" y="32" width="6" height="12" fill="#E53935" />
  <rect x="44" y="38" width="4" height="8" fill="#C62828" />
  <!-- Thruster Engine -->
  <rect x="26" y="42" width="12" height="4" fill="#546E7A" />
  <!-- Exhaust Flames -->
  <rect x="28" y="46" width="8" height="6" fill="#FFA000" />
  <rect x="30" y="52" width="4" height="4" fill="#FFD54F" />
  <rect x="31" y="46" width="2" height="6" fill="#FFFFFF" />
</svg>
