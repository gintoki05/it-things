  <rect width="64" height="64" rx="32" fill="#5D4037" />
  <!-- Steam (Animated-look pixel smoke) -->
  <rect x="22" y="10" width="2" height="4" fill="#D7CCC8" />
  <rect x="24" y="14" width="2" height="4" fill="#D7CCC8" />
  <rect x="30" y="8" width="2" height="4" fill="#D7CCC8" />
