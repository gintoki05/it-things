  <!-- Ears -->
  <rect x="18" y="14" width="6" height="8" fill="#F39C12" />
  <rect x="20" y="16" width="2" height="4" fill="#FADBD8" />
  <rect x="40" y="14" width="6" height="8" fill="#F39C12" />
  <rect x="42" y="16" width="2" height="4" fill="#FADBD8" />
