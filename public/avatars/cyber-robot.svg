<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Background Circle -->
  <rect width="64" height="64" rx="32" fill="#2E4057" />
  <!-- Antenna -->
  <rect x="30" y="8" width="4" height="6" fill="#D4DDE6" />
  <rect x="28" y="6" width="8" height="4" fill="#FFD700" />
  <!-- Ears / Bolts -->
  <rect x="10" y="24" width="4" height="12" fill="#FF5555" />
  <rect x="50" y="24" width="4" height="12" fill="#FF5555" />
  <!-- Head Box -->
  <rect x="14" y="14" width="36" height="34" fill="#8FA4B8" rx="2" />
  <rect x="14" y="14" width="36" height="2" fill="#FFFFFF" />
  <rect x="14" y="14" width="2" height="34" fill="#FFFFFF" />
  <rect x="48" y="16" width="2" height="32" fill="#3D5066" />
  <rect x="16" y="46" width="34" height="2" fill="#3D5066" />
  <!-- Eye Visor Area -->
  <rect x="18" y="20" width="28" height="12" fill="#14253D" />
  <!-- Glowing Pixel Eyes -->
  <rect x="22" y="23" width="6" height="6" fill="#00E5FF" />
  <rect x="36" y="23" width="6" height="6" fill="#00E5FF" />
  <rect x="24" y="24" width="2" height="2" fill="#FFFFFF" />
  <rect x="38" y="24" width="2" height="2" fill="#FFFFFF" />
  <!-- Mouth Grid -->
  <rect x="22" y="38" width="20" height="4" fill="#14253D" />
  <rect x="25" y="39" width="2" height="2" fill="#FFD700" />
  <rect x="29" y="39" width="2" height="2" fill="#FFD700" />
  <rect x="33" y="39" width="2" height="2" fill="#FFD700" />
  <rect x="37" y="39" width="2" height="2" fill="#FFD700" />
  <!-- Neck -->
  <rect x="26" y="48" width="12" height="6" fill="#5E7287" />
  <rect x="28" y="50" width="8" height="2" fill="#3D5066" />
</svg>
