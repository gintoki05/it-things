<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Background Circle -->
  <rect width="64" height="64" rx="32" fill="#3B264E" />
  <!-- Controller Body -->
  <rect x="10" y="20" width="44" height="24" rx="4" fill="#D4DDE6" />
  <rect x="10" y="20" width="44" height="2" fill="#FFFFFF" />
  <rect x="10" y="20" width="2" height="24" fill="#FFFFFF" />
  <rect x="10" y="42" width="44" height="2" fill="#5E7287" />
  <rect x="52" y="22" width="2" height="22" fill="#5E7287" />
  <!-- Inner Dark Panel -->
  <rect x="14" y="24" width="36" height="16" fill="#1C2630" />
  <!-- D-Pad (Left) -->
  <rect x="18" y="28" width="8" height="8" fill="#5E7287" />
  <rect x="16" y="30" width="12" height="4" fill="#5E7287" />
  <rect x="20" y="30" width="4" height="4" fill="#2E3D4D" />
  <!-- Select & Start Buttons -->
  <rect x="29" y="34" width="3" height="2" fill="#8FA4B8" />
  <rect x="33" y="34" width="3" height="2" fill="#8FA4B8" />
  <!-- Action Buttons (A & B in Red) -->
  <rect x="42" y="32" width="4" height="4" fill="#E53935" rx="1" />
  <rect x="38" y="30" width="4" height="4" fill="#E53935" rx="1" />
  <!-- Controller Cord -->
  <rect x="30" y="14" width="4" height="6" fill="#2E3D4D" />
</svg>
