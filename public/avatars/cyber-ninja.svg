<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Background Circle -->
  <rect width="64" height="64" rx="32" fill="#1C2833" />
  <!-- Ninja Hood / Mask -->
  <rect x="16" y="12" width="32" height="38" fill="#17202A" rx="4" />
  <!-- Red Headband / Forehead Protector -->
  <rect x="14" y="18" width="36" height="6" fill="#C0392B" />
  <rect x="28" y="19" width="8" height="4" fill="#BDC3C7" />
  <rect x="31" y="20" width="2" height="2" fill="#2C3E50" />
  <!-- Eye Opening -->
  <rect x="18" y="26" width="28" height="10" fill="#F5CBA7" />
  <!-- Ninja Eyes (Fierce) -->
  <rect x="22" y="29" width="6" height="3" fill="#17202A" />
  <rect x="36" y="29" width="6" height="3" fill="#17202A" />
  <rect x="24" y="30" width="2" height="2" fill="#FFFFFF" />
  <rect x="38" y="30" width="2" height="2" fill="#FFFFFF" />
  <!-- Eye Slit Shadow / Brow -->
  <rect x="20" y="26" width="10" height="2" fill="#2C3E50" />
  <rect x="34" y="26" width="10" height="2" fill="#2C3E50" />
  <!-- Mask Covering Mouth / Neck -->
  <rect x="16" y="36" width="32" height="16" fill="#212F3D" />
  <!-- Shoulders -->
  <rect x="10" y="50" width="44" height="14" fill="#17202A" />
</svg>
